name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the web app's component tests run in a real browser
      - run: pnpm --filter @tramline/web exec playwright install --with-deps chromium
      # fails when any workspace drops below its coverage thresholds
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          for f in packages/*/coverage/coverage-summary.json apps/*/coverage/coverage-summary.json; do
            [ -f "$f" ] || continue
            node -e "const t=require('./$f').total;console.log('| $(dirname $(dirname $f)) | '+['lines','branches','functions','statements'].map(k=>t[k].pct+'%').join(' | ')+' |')"
          done | (echo '| Workspace | Lines | Branches | Functions | Statements |'; echo '|---|---|---|---|---|'; cat) >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tramline/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
