name: Agent image

# Publishes the node agent that install.sh runs, for amd64 and arm64.
on:
  push:
    branches: [main]
    paths:
      - apps/agent/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - .github/workflows/agent-image.yml
  pull_request:
    paths:
      - apps/agent/**
      - packages/contracts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # signed provenance for the published image
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          # pull requests only check that it builds
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jtcorrin/tramline-agent:latest
            ghcr.io/jtcorrin/tramline-agent:${{ github.sha }}
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/jtcorrin/tramline-agent
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
